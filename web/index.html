<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4338CA" />
    <title>Sedifex — Run the business. Grow the brand.</title>

    <!-- Tailwind utilities for the Website Builder UI.
         Preflight is disabled so existing Sedifex custom CSS is not reset. -->
    <script>
      window.tailwind = window.tailwind || {}
      window.tailwind.config = {
        corePlugins: {
          preflight: false,
        },
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/shell-navigation.css" />
    <link rel="stylesheet" href="/website-template-enhancements.css" />
    <link rel="stylesheet" href="/dashboard-stock-alerts.css" />

    <!-- Paystack Inline (needed for card/mobile checkout) -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Google tag (gtag.js) -->
    <script>
      (function () {
        const tagId = '%VITE_GOOGLE_TAG_ID%'
        if (!tagId || tagId.includes('%VITE_GOOGLE_TAG_ID%')) return

        const script = document.createElement('script')
        script.async = true
        script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(tagId)}`
        document.head.appendChild(script)

        window.dataLayer = window.dataLayer || []
        function gtag() {
          window.dataLayer.push(arguments)
        }

        gtag('js', new Date())
        gtag('config', tagId)
        window.gtag = gtag
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="recaptcha-container"></div>

    <!-- Your app entry -->
    <script type="module" src="/src/main.tsx"></script>
    <script src="/website-template-enhancements.js"></script>
    <script src="/website-template-apply-bridge.js"></script>
  </body>
</html>
