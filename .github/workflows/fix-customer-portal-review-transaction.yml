name: Fix customer portal review transaction

on:
  push:
    branches:
      - feature/customer-portal-self-service
    paths:
      - '.github/workflows/fix-customer-portal-review-transaction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-portal-self-service
      - run: python scripts/fix_customer_portal_review_transaction.py
      - run: rm scripts/fix_customer_portal_review_transaction.py .github/workflows/fix-customer-portal-review-transaction.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: return customer portal review transaction result'
          git push origin HEAD:feature/customer-portal-self-service
