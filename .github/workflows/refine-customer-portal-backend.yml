name: Refine customer portal backend

on:
  push:
    branches:
      - feature/customer-self-service-portal
    paths:
      - '.github/workflows/refine-customer-portal-backend.yml'
      - 'scripts/refine_customer_portal_backend.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/customer-self-service-portal

      - name: Refine customer portal backend
        run: python scripts/refine_customer_portal_backend.py

      - name: Commit refinement
        run: |
          if git diff --quiet; then
            echo 'No refinement changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/src/customerPortal.ts
          git commit -m 'fix: improve customer portal data lookup'
          git push origin HEAD:feature/customer-self-service-portal
