name: Update web lockfile PR1658

on:
  push:
    branches:
      - fix/vercel-node-build-dependency
    paths:
      - '.github/workflows/update-web-lockfile-pr1658.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-node-build-dependency
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        working-directory: web
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate web dependency lockfile'
          git push origin HEAD:fix/vercel-node-build-dependency
