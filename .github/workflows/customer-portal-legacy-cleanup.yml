name: Customer portal legacy cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/customer-portal-legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Write service account key
        run: |
          cat > "$HOME/gcp-key.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEDIFEX }}
          EOF

      - name: Migrate and remove legacy portal-link records
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/unused
        run: |
          node <<'NODE'
          const fs = require('fs')
          const admin = require('./functions/node_modules/firebase-admin')
          const key = JSON.parse(fs.readFileSync(process.env.HOME + '/gcp-key.json', 'utf8'))
          admin.initializeApp({ credential: admin.credential.cert(key), projectId: 'sedifex-web' })
          const db = admin.firestore()

          ;(async () => {
            const legacySnapshot = await db.collection('customerPortalLinks').get()
            let migrated = 0
            let removed = 0
            let alreadyProtected = 0

            for (const legacyDoc of legacySnapshot.docs) {
              const data = legacyDoc.data() || {}
              const customerId = typeof data.customerId === 'string' ? data.customerId.trim() : ''
              const protectedRef = db.collection('eventClientLinks').doc(legacyDoc.id)
              const customerRef = customerId ? db.collection('customers').doc(customerId) : null

              await db.runTransaction(async tx => {
                const customerSnap = customerRef ? await tx.get(customerRef) : null
                const protectedSnap = await tx.get(protectedRef)
                const customer = customerSnap && customerSnap.exists ? customerSnap.data() || {} : {}
                const portal = customer.portal && typeof customer.portal === 'object' ? customer.portal : {}
                const valid = Boolean(
                  customerRef &&
                  customerSnap && customerSnap.exists &&
                  portal.status === 'active' &&
                  portal.publicLinkHash === legacyDoc.id &&
                  customer.storeId === data.storeId
                )

                if (valid) {
                  if (!protectedSnap.exists) {
                    tx.set(protectedRef, {
                      ...data,
                      linkKind: 'customer_portal',
                      migratedAt: admin.firestore.FieldValue.serverTimestamp(),
                      updatedAt: admin.firestore.FieldValue.serverTimestamp(),
                    }, { merge: true })
                    migrated += 1
                  } else {
                    alreadyProtected += 1
                  }
                  tx.update(customerRef, {
                    'portal.linkCollection': 'eventClientLinks',
                    updatedAt: admin.firestore.FieldValue.serverTimestamp(),
                  })
                } else {
                  removed += 1
                }
                tx.delete(legacyDoc.ref)
              })
            }

            console.log(JSON.stringify({ scanned: legacySnapshot.size, migrated, alreadyProtected, removed }))
          })().then(() => process.exit(0)).catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Remove one-time cleanup workflow
        run: |
          rm .github/workflows/customer-portal-legacy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove customer portal legacy cleanup workflow'
          git push origin HEAD:main
