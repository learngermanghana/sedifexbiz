name: Apply customer portal wiring

on:
  push:
    branches:
      - feature/customer-self-service-portal
    paths:
      - '.github/workflows/apply-customer-portal-wiring.yml'
      - 'scripts/apply_customer_portal_wiring.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/customer-self-service-portal

      - name: Apply customer portal wiring
        run: python scripts/apply_customer_portal_wiring.py

      - name: Commit wiring
        run: |
          if git diff --quiet; then
            echo 'No wiring changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/src/index.ts web/src/main.tsx web/src/pages/CustomerCRM.tsx firestore.rules web/tests/event-planning-security-regressions.rules.emulator.test.ts
          git commit -m 'feat: wire customer portal into CRM and routing'
          git push origin HEAD:feature/customer-self-service-portal
