name: Apply email automation review fixes

on:
  push:
    branches:
      - feature/email-automation-engine-v1
    paths:
      - '.github/workflows/apply-email-automation-review.yml'
      - 'scripts/patch_email_automation_review.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/email-automation-engine-v1

      - name: Apply review fixes
        run: python scripts/patch_email_automation_review.py

      - name: Commit review fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/src/bookingEmailAutomation.ts functions/src/bookingEmailNotifications.ts functions/src/eventCommunications.ts
          git commit -m 'fix: harden transactional email automation'
          git push origin HEAD:feature/email-automation-engine-v1
