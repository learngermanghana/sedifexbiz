name: Firebase Functions CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'functions/**'
      - '.github/workflows/functions-ci.yml'

jobs:
  functions-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Build Functions
        run: npm run build
        working-directory: functions

      - name: Test automation settings
        run: npm run test:automation-settings
        working-directory: functions

      - name: Test booking lifecycle SMS rules
        run: npm run test:booking-lifecycle-sms
        working-directory: functions

      - name: Test booking SMS initial store status
        run: node test/bookingSmsStoreAlertStatus.test.js
        working-directory: functions

      - name: Test event audit
        run: npm run test:event-audit
        working-directory: functions

      - name: Test event contract signing
        run: npm run test:event-contract
        working-directory: functions

      - name: Test event client collaboration
        run: npm run test:event-client
        working-directory: functions
