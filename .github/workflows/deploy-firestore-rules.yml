name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

concurrency:
  group: firestore-rules-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: |
          cat > "$HOME/gcp-key.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEDIFEX }}
          EOF

      - name: Validate service account key
        run: |
          node -e "const fs=require('fs'); const key=JSON.parse(fs.readFileSync(process.env.HOME + '/gcp-key.json', 'utf8')); if(!key.client_email || !key.private_key || !key.project_id){ throw new Error('Invalid service account JSON'); } console.log('Using service account:', key.client_email);"

      - name: Set Google credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=sedifex-web" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=sedifex-web" >> "$GITHUB_ENV"
          echo "FIREBASE_PROJECT_ID=sedifex-web" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project sedifex-web --force
