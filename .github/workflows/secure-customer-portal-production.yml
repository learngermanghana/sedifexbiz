name: Secure customer portal production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/secure-customer-portal-production.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Move customer portal links behind existing protected boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          portal_path = Path('functions/src/customerPortal.ts')
          portal = portal_path.read_text()
          portal = portal.replace(
              "type CustomerPortalLink = {\n  storeId: string",
              "type CustomerPortalLink = {\n  linkKind?: 'customer_portal'\n  storeId: string",
              1,
          )
          portal = portal.replace("defaultDb.collection('customerPortalLinks')", "defaultDb.collection('eventClientLinks')")
          old_load = """  const linkRef = defaultDb.collection('eventClientLinks').doc(hash)\n  const linkSnapshot = await linkRef.get()\n  if (!linkSnapshot.exists) throw new Error('INVALID_LINK')\n  const link = linkSnapshot.data() as unknown as CustomerPortalLink\n  if (link.status !== 'active') throw new Error('LINK_REVOKED')\n  if (!link.expiresAt?.toMillis || link.expiresAt.toMillis() < Date.now()) throw new Error('LINK_EXPIRED')\n\n  const customerRef = defaultDb.collection('customers').doc(link.customerId)\n  const customerSnapshot = await customerRef.get()\n  if (!customerSnapshot.exists) throw new Error('CUSTOMER_NOT_FOUND')\n  const customer = customerSnapshot.data() as RecordMap\n  if (text(customer.storeId, 180) !== link.storeId) throw new Error('INVALID_LINK')\n  const portal = record(customer.portal)\n  if (text(portal.publicLinkHash, 100) !== hash || text(portal.status, 40) !== 'active') throw new Error('LINK_REVOKED')\n  return { token, hash, linkRef, link, customerRef, customer }\n"""
          new_load = """  const linkRef = defaultDb.collection('eventClientLinks').doc(hash)\n  let linkSnapshot = await linkRef.get()\n  let legacyRef: FirebaseFirestore.DocumentReference | null = null\n  let legacy = false\n  if (!linkSnapshot.exists) {\n    legacyRef = defaultDb.collection('customerPortalLinks').doc(hash)\n    linkSnapshot = await legacyRef.get()\n    if (!linkSnapshot.exists) throw new Error('INVALID_LINK')\n    legacy = true\n  }\n  const link = linkSnapshot.data() as unknown as CustomerPortalLink\n  if (!legacy && link.linkKind !== 'customer_portal') throw new Error('INVALID_LINK')\n  if (link.status !== 'active') throw new Error('LINK_REVOKED')\n  if (!link.expiresAt?.toMillis || link.expiresAt.toMillis() < Date.now()) throw new Error('LINK_EXPIRED')\n\n  const customerRef = defaultDb.collection('customers').doc(link.customerId)\n  const customerSnapshot = await customerRef.get()\n  if (!customerSnapshot.exists) throw new Error('CUSTOMER_NOT_FOUND')\n  const customer = customerSnapshot.data() as RecordMap\n  if (text(customer.storeId, 180) !== link.storeId) throw new Error('INVALID_LINK')\n  const portal = record(customer.portal)\n  if (text(portal.publicLinkHash, 100) !== hash || text(portal.status, 40) !== 'active') throw new Error('LINK_REVOKED')\n\n  if (legacy && legacyRef) {\n    const now = admin.firestore.FieldValue.serverTimestamp()\n    await defaultDb.runTransaction(async transaction => {\n      transaction.set(linkRef, {\n        ...link,\n        linkKind: 'customer_portal',\n        migratedAt: now,\n        updatedAt: now,\n      }, { merge: true })\n      transaction.delete(legacyRef as FirebaseFirestore.DocumentReference)\n      transaction.update(customerRef, {\n        'portal.linkCollection': 'eventClientLinks',\n        updatedAt: now,\n      })\n    })\n  }\n  return { token, hash, linkRef, link: { ...link, linkKind: 'customer_portal' as const }, customerRef, customer }\n"""
          if old_load not in portal:
              raise SystemExit('customerPortal loadLink anchor missing')
          portal = portal.replace(old_load, new_load, 1)
          portal = portal.replace(
              "transaction.set(linkRef, {\n      storeId,",
              "transaction.set(linkRef, {\n      linkKind: 'customer_portal',\n      storeId,",
              1,
          )
          portal = portal.replace(
              "publicLinkHash: hash,\n        publicUrl,",
              "publicLinkHash: hash,\n        linkCollection: 'eventClientLinks',\n        publicUrl,",
              1,
          )
          portal_path.write_text(portal)

          auto_path = Path('functions/src/customerPortalBookingAutomation.ts')
          auto = auto_path.read_text()
          auto = auto.replace("defaultDb.collection('customerPortalLinks')", "defaultDb.collection('eventClientLinks')")
          old_active = "return text(portal.status, 40) === 'active' && Boolean(publicUrl && hash) && expiresAtMs > Date.now()"
          new_active = "return text(portal.status, 40) === 'active' && text(portal.linkCollection, 80) === 'eventClientLinks' && Boolean(publicUrl && hash) && expiresAtMs > Date.now()"
          if old_active not in auto:
              raise SystemExit('activePortal anchor missing')
          auto = auto.replace(old_active, new_active, 1)
          auto = auto.replace(
              "transaction.set(defaultDb.collection('eventClientLinks').doc(hash), {\n      storeId,",
              "transaction.set(defaultDb.collection('eventClientLinks').doc(hash), {\n      linkKind: 'customer_portal',\n      storeId,",
              1,
          )
          auto = auto.replace(
              "publicLinkHash: hash,\n        publicUrl: candidateUrl,",
              "publicLinkHash: hash,\n        linkCollection: 'eventClientLinks',\n        publicUrl: candidateUrl,",
              1,
          )
          auto_path.write_text(auto)

          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()
          customer_rule = """\n    // Customer portal links are bearer credentials. Public clients access the\n    // portal through a callable function; browser Firestore clients must never\n    // enumerate or forge these records.\n    match /customerPortalLinks/{linkId} {\n      allow read, create, update, delete: if false;\n    }\n"""
          rules = rules.replace(customer_rule, '', 1)
          rules = rules.replace("\n        && topCollection != 'eventClientLinks'\n        && topCollection != 'customerPortalLinks';", "\n        && topCollection != 'eventClientLinks';", 1)
          rules_path.write_text(rules)

          test_path = Path('web/tests/event-planning-security-regressions.rules.emulator.test.ts')
          tests = test_path.read_text()
          tests = re.sub(
              r"\n  test\('customer portal bearer-link records are never exposed to browser Firestore clients',[\s\S]*?\n  \}\)\n(?=\n\}\)\s*$)",
              '',
              tests,
              count=1,
          )
          test_path.write_text(tests)

          deploy_workflow = Path('.github/workflows/deploy-firestore-rules.yml')
          if deploy_workflow.exists():
              deploy_workflow.unlink()

          Path('.github/workflows/secure-customer-portal-production.yml').unlink()
          PY

      - name: Validate portal link boundary
        run: |
          grep -q "collection('eventClientLinks')" functions/src/customerPortal.ts
          grep -q "linkKind: 'customer_portal'" functions/src/customerPortal.ts
          grep -q "linkCollection: 'eventClientLinks'" functions/src/customerPortalBookingAutomation.ts
          if grep -q "match /customerPortalLinks" firestore.rules; then exit 1; fi

      - name: Commit production hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: secure customer portal with existing bearer boundary'
          git push origin HEAD:main
