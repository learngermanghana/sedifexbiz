name: Apply customer portal self-service UI

on:
  push:
    branches:
      - feature/customer-portal-self-service
    paths:
      - '.github/workflows/apply-customer-portal-self-service-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-portal-self-service
      - run: python scripts/apply_customer_portal_self_service_ui.py
      - run: rm scripts/apply_customer_portal_self_service_ui.py .github/workflows/apply-customer-portal-self-service-ui.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add customer portal request review UI'
          git push origin HEAD:feature/customer-portal-self-service
