name: Apply booking detail navigation fix

on:
  push:
    branches:
      - fix/booking-detail-navigation
    paths:
      - '.github/workflows/apply-booking-detail-navigation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/booking-detail-navigation

      - name: Apply navigation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard_path = Path('web/src/components/CompactBusinessDashboard.tsx')
          dashboard = dashboard_path.read_text()
          old_dashboard = """          to: industry === 'event' ? '/event-planning' : '/upcoming-events',
          linkLabel: 'View schedule',
"""
          new_dashboard = """          to: upcomingEntries.length === 1
            ? upcomingEntries[0].to
            : eventEntries.length === 0
              ? '/bookings'
              : bookingEntries.length === 0
                ? '/event-planning'
                : '/upcoming-events',
          linkLabel: upcomingEntries.length === 1
            ? (upcomingEntries[0].to.startsWith('/bookings/') ? 'Open booking' : 'Open event')
            : eventEntries.length === 0
              ? 'View bookings'
              : bookingEntries.length === 0
                ? 'View events'
                : 'View schedule',
"""
          if old_dashboard not in dashboard:
              raise SystemExit('dashboard upcoming route anchor missing')
          dashboard = dashboard.replace(old_dashboard, new_dashboard, 1)
          dashboard_path.write_text(dashboard)

          crm_path = Path('web/src/pages/CustomerCRM.tsx')
          crm = crm_path.read_text()
          helper_anchor = """function isBookingLike(data: RecordMap): boolean {
"""
          helper = """function bookingHref(row: DataRow): string {
  const canonicalBookingId = firstText(row.data, ['bookingId', 'booking_id'])
  if (canonicalBookingId) return `/bookings/${encodeURIComponent(canonicalBookingId)}`
  if (row.source === 'store' || row.source === 'root') return `/bookings/${encodeURIComponent(row.id)}`
  return '/reports/bookings'
}

function isBookingLike(data: RecordMap): boolean {
"""
          if helper_anchor not in crm:
              raise SystemExit('CustomerCRM helper anchor missing')
          crm = crm.replace(helper_anchor, helper, 1)

          old_timeline = """      rows.push({ id: `booking-${row.id}`, kind: 'Booking', title: service, detail: bookingDate ? `Booked for ${bookingDate}` : 'Booking activity', date: recordDate(row.data), href: '/bookings' })
"""
          new_timeline = """      rows.push({ id: `booking-${row.id}`, kind: 'Booking', title: service, detail: bookingDate ? `Booked for ${bookingDate}` : 'Booking activity', date: recordDate(row.data), href: bookingHref(row) })
"""
          if old_timeline not in crm:
              raise SystemExit('CustomerCRM timeline booking anchor missing')
          crm = crm.replace(old_timeline, new_timeline, 1)

          old_record = """            <div><span>{statusText(firstText(row.data, ['bookingStatus', 'status']))}</span><span>{statusText(firstText(row.data, ['paymentStatus', 'payment.status']), 'Payment not recorded')}</span></div>
          </article>
"""
          new_record = """            <div><span>{statusText(firstText(row.data, ['bookingStatus', 'status']))}</span><span>{statusText(firstText(row.data, ['paymentStatus', 'payment.status']), 'Payment not recorded')}</span></div>
            <Link to={bookingHref(row)}>Open booking →</Link>
          </article>
"""
          if old_record not in crm:
              raise SystemExit('CustomerCRM booking record anchor missing')
          crm = crm.replace(old_record, new_record, 1)
          crm_path.write_text(crm)

          editor_path = Path('web/src/pages/BookingEditor.tsx')
          editor = editor_path.read_text()
          old_save_nav = """      void playSound('success')
      navigate('/bookings')
    } catch (error) {
      console.error('[booking-editor] Failed to save booking', error)
"""
          new_save_nav = """      void playSound('success')
      navigate(`/bookings/${encodeURIComponent(targetId)}`)
    } catch (error) {
      console.error('[booking-editor] Failed to save booking', error)
"""
          if old_save_nav not in editor:
              raise SystemExit('BookingEditor save navigation anchor missing')
          editor = editor.replace(old_save_nav, new_save_nav, 1)
          editor_path.write_text(editor)
          PY

      - name: Remove helper workflow
        run: rm .github/workflows/apply-booking-detail-navigation-fix.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep booking links on booking details'
          git push origin HEAD:fix/booking-detail-navigation
