name: Apply automation settings save patch

on:
  push:
    branches:
      - feature/automation-center
    paths:
      - '.github/workflows/apply-automation-settings-save.yml'
      - 'scripts/patch_automation_settings_save.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/automation-center
      - name: Patch settings save
        run: python scripts/patch_automation_settings_save.py
      - name: Commit settings save
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/pages/AutomationCenter.tsx
          git commit -m 'fix: preserve existing notification integrations on save'
          git push origin HEAD:feature/automation-center
