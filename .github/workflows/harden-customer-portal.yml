name: Harden customer portal

on:
  push:
    branches:
      - feature/customer-self-service-portal
    paths:
      - '.github/workflows/harden-customer-portal.yml'
      - 'scripts/harden_customer_portal.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/customer-self-service-portal

      - name: Apply customer portal hardening
        run: python scripts/harden_customer_portal.py

      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo 'No hardening changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/src/customerPortal.ts
          git commit -m 'fix: harden customer portal output'
          git push origin HEAD:feature/customer-self-service-portal
