name: Apply automation center patch

on:
  push:
    branches:
      - feature/automation-center
    paths:
      - '.github/workflows/apply-automation-center.yml'
      - 'scripts/patch_automation_center.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/automation-center

      - name: Apply automation center integration
        run: python scripts/patch_automation_center.py

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/main.tsx web/src/config/navigation.ts functions/src/notifications.ts functions/src/emailDelivery.ts firestore.rules
          git commit -m 'feat: wire automation center to email engine'
          git push origin HEAD:feature/automation-center
