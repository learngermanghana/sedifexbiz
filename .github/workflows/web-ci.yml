name: Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'firestore.rules'
      - '.github/workflows/web-ci.yml'

jobs:
  web-ci:
    runs-on: ubuntu-latest
    env:
      VITE_FB_API_KEY: fake-ci-api-key
      VITE_FB_AUTH_DOMAIN: sedifex-ci.firebaseapp.com
      VITE_FB_PROJECT_ID: sedifex-ci
      VITE_FB_STORAGE_BUCKET: sedifex-ci.appspot.com
      VITE_FB_APP_ID: 1:123456789:web:ci
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Test web
        run: npm test
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web
