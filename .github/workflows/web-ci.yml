name: Event Planning Web CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'firebase.event-planning-ci.json'
      - '.github/workflows/web-ci.yml'

jobs:
  event-planning-web-ci:
    runs-on: ubuntu-latest
    env:
      VITE_FB_API_KEY: fake-ci-api-key
      VITE_FB_AUTH_DOMAIN: sedifex-ci.firebaseapp.com
      VITE_FB_PROJECT_ID: sedifex-ci
      VITE_FB_STORAGE_BUCKET: sedifex-ci.appspot.com
      VITE_FB_APP_ID: 1:123456789:web:ci
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 10.9.8 bundled with the current Node 22 runner has an Arborist
      # edgesOut crash while resolving this manifest. npm 11.6.x fixes it.
      - name: Pin npm for dependency resolution
        run: npm install --global npm@11.6.0

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install web dependencies
        # package-lock.json currently predates the Microsoft/Azure packages in
        # package.json. Remove it in the disposable runner so npm installs from
        # the current manifest without mutating the repository lockfile.
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --no-audit --no-fund
        working-directory: web

      - name: Test sales history regressions
        run: npm exec vitest run src/components/salesHistoryRegression.test.tsx
        working-directory: web

      - name: Test event task progress
        run: npm exec vitest run src/utils/eventPlanningProgress.test.ts
        working-directory: web

      - name: Test smart production operations
        run: npm exec vitest run src/utils/eventProductionTemplates.test.ts src/utils/eventProductionOperations.test.ts src/utils/eventProductionOperations.cost-regression.test.ts
        working-directory: web

      - name: Test reusable event checklist templates
        run: for test in tests/event-checklist-template*.test.mjs; do node "$test"; done
        working-directory: web

      - name: Test Event Workspace PDF builder
        run: npm exec vitest run src/utils/eventPdfDocument.test.ts
        working-directory: web

      - name: Test Event Planning Firestore rules
        env:
          RUN_EVENT_PLANNING_EMULATOR_TESTS: '1'
          GCLOUD_PROJECT: sedifex-ci
        run: >-
          firebase emulators:exec
          --config firebase.event-planning-ci.json
          --only auth,firestore
          --project sedifex-ci
          "cd web && npm exec vitest run tests/event-planning.rules.emulator.test.ts tests/event-planning-security-regressions.rules.emulator.test.ts"

      # Vite proves the changed web code can be bundled for production. The
      # repository currently has unrelated legacy TypeScript errors across
      # Account, Sell, Reports and older document helpers, so keep that broader
      # typecheck visible without making this Event Planning-specific gate lie
      # about the feature under test.
      - name: Build production web bundle
        run: npm exec vite build
        working-directory: web

      - name: Report repository TypeScript debt
        continue-on-error: true
        run: npm exec tsc -b
        working-directory: web
