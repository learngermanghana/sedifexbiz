name: Apply customer portal session isolation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: fix/customer-portal-session-isolation

      - name: Apply patch
        run: python scripts/apply_customer_portal_session_isolation.py

      - name: Remove helper files
        run: rm scripts/apply_customer_portal_session_isolation.py .github/workflows/apply-customer-portal-session-isolation.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix customer portal session isolation'
          git push origin HEAD:fix/customer-portal-session-isolation
