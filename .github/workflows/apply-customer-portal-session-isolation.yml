name: Apply customer portal session isolation

on:
  push:
    branches:
      - fix/customer-portal-session-isolation
    paths:
      - 'scripts/apply_customer_portal_session_isolation.py'
      - '.github/workflows/apply-customer-portal-session-isolation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: fix/customer-portal-session-isolation

      - name: Apply patch
        run: python scripts/apply_customer_portal_session_isolation.py

      - name: Test session isolation patch
        run: node web/tests/customer-portal-session-isolation.test.mjs

      - name: Remove patch script
        run: rm scripts/apply_customer_portal_session_isolation.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix customer portal session isolation'
          git push origin HEAD:fix/customer-portal-session-isolation
