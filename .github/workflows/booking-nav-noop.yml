name: Apply booking navigation fix
on:
  push:
    branches:
      - fix/booking-detail-navigation
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/booking-detail-navigation
      - name: Apply patch
        run: python scripts/apply_booking_detail_navigation_fix.py
      - name: Remove temporary helpers
        run: |
          rm scripts/apply_booking_detail_navigation_fix.py
          rm .github/workflows/booking-nav-noop.yml
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep booking links on booking details'
          git push origin HEAD:fix/booking-detail-navigation
