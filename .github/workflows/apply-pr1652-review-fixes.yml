name: Apply PR 1652 review fixes

on:
  push:
    branches:
      - feature/automation-center
    paths:
      - '.github/workflows/apply-pr1652-review-fixes.yml'
      - 'scripts/fix_pr1652_review.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/automation-center

      - name: Apply review fixes
        run: python scripts/fix_pr1652_review.py

      - name: Commit review fixes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules functions/src/emailDelivery.ts web/src/pages/AutomationCenter.tsx
          git commit -m 'fix: address automation center review findings'
          git push origin HEAD:feature/automation-center
