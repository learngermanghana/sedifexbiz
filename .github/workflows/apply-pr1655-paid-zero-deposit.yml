name: Apply PR1655 paid payment patch

on:
  push:
    branches:
      - fix/customer-portal-payment-email-status
    paths:
      - '.github/workflows/apply-pr1655-paid-zero-deposit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-portal-payment-email-status
      - run: python scripts/fix_pr1655_paid_zero_deposit.py
      - run: rm scripts/fix_pr1655_paid_zero_deposit.py .github/workflows/apply-pr1655-paid-zero-deposit.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve paid totals when deposit is zero'
          git push origin HEAD:fix/customer-portal-payment-email-status
