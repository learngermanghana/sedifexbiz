name: Target web lockfile PR1658

on:
  push:
    branches:
      - fix/vercel-node-build-dependency
    paths:
      - '.github/workflows/target-web-lockfile-pr1658.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with main
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-node-build-dependency
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore main lockfile
        run: git checkout origin/main -- web/package-lock.json
      - name: Update only required dependency locks
        working-directory: web
        run: npm install --package-lock-only --no-audit --no-fund --save-dev @vercel/node@5.10.2 eslint-plugin-jest-dom@5.10.1
      - name: Commit targeted lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package.json web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Vercel API dependency lockfile'
          git push origin HEAD:fix/vercel-node-build-dependency
