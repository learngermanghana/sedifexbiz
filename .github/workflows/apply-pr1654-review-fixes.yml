name: Apply PR1654 review fixes

on:
  push:
    branches:
      - fix/booking-detail-navigation
    paths:
      - '.github/workflows/apply-pr1654-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/booking-detail-navigation
      - run: python scripts/fix_pr1654_review.py
      - run: rm scripts/fix_pr1654_review.py .github/workflows/apply-pr1654-review-fixes.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address booking navigation review comments'
          git push origin HEAD:fix/booking-detail-navigation
