name: Apply dashboard review fixes

on:
  push:
    branches:
      - feature/customizable-business-dashboard
    paths:
      - '.github/workflows/fix-dashboard-review.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/customizable-business-dashboard

      - name: Apply review fixes
        run: python scripts/fix_dashboard_review.py

      - name: Commit review fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/components/CompactBusinessDashboard.tsx
          git commit -m 'fix: persist dashboard ordering and align event tasks'
          git push origin HEAD:feature/customizable-business-dashboard
